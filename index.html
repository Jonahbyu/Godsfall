<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Godsfall</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<!--
  Injected into the exported page's <head> via `html/head_include` in
  export_presets.cfg. `tools/export-web.ps1` reads this file and writes it into
  the preset before exporting, so this stays editable as real HTML instead of
  living as one escaped line inside a .cfg.

  Deliberately NOT a custom_html_shell. A full shell means forking Godot's boot
  script — the progress bar, the missing-feature detection, the service worker
  retry — and re-merging it by hand on every engine upgrade. Everything here is
  additive and touches nothing Godot generates, so an upgrade cannot silently
  break it.
-->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14121a">

<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	background: #14121a;
	overflow: hidden;
	/* Stop iOS bumping font sizes when the phone is rotated to landscape,
	   which would desync the canvas from the CSS pixel size Godot measured. */
	-webkit-text-size-adjust: 100%;
}

body {
	/* 100dvh, not 100vh. On mobile Safari and Chrome `vh` is locked to the
	   viewport with the URL bar *hidden*, so a 100vh body is taller than the
	   visible page while the bar is showing — which is exactly the overflow
	   that makes the game sit half off-screen and scroll under the chrome.
	   `dvh` tracks the bar sliding away. The vh line before it is the fallback
	   for browsers without dvh, where the old behaviour is no worse than today. */
	height: 100vh;
	height: 100dvh;
	/* The canvas handles its own input; without this the browser also pans and
	   pinch-zooms the page under it. */
	touch-action: none;
	overscroll-behavior: none;
}

#canvas {
	width: 100% !important;
	height: 100% !important;
	display: block;
	/* Godot focuses the canvas on start; the focus ring is noise on a game. */
	outline: none;
	/* Long-press on a canvas otherwise raises the iOS callout menu mid-drag. */
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
}

/* The fullscreen toggle.
   Placed over the canvas rather than beside it: the canvas is sized to the
   whole viewport, so any element in normal flow would shrink it. */
#gf-fullscreen {
	position: fixed;
	/* Clear of the notch / status bar on a phone, and of nothing on a desktop. */
	top: calc(env(safe-area-inset-top, 0px) + 8px);
	right: calc(env(safe-area-inset-right, 0px) + 8px);
	z-index: 100;

	width: 40px;
	height: 40px;
	padding: 0;
	display: none;               /* shown by the script once it knows it can work */
	align-items: center;
	justify-content: center;

	background: rgba(23, 20, 31, 0.82);
	color: #e6e1f0;
	border: 1px solid #3a3348;   /* Palette.BORDER, so it reads as part of the game */
	border-radius: 6px;
	cursor: pointer;
	font-size: 18px;
	line-height: 1;

	/* The button is a browser control sitting on top of a game that wants every
	   other touch. Its own taps must not be swallowed by the canvas rules above. */
	touch-action: manipulation;
	-webkit-tap-highlight-color: transparent;
}

#gf-fullscreen:hover {
	border-color: #7c4dff;       /* Palette.ACCENT */
	background: rgba(34, 29, 46, 0.92);
}

/* Fade to nearly-invisible once the game has been played with for a moment, so
   a permanent button is not parked over the enemy board. Any pointer movement
   or touch brings it back — see the script. */
#gf-fullscreen.gf-idle {
	opacity: 0.18;
}

#gf-fullscreen {
	transition: opacity 0.25s ease, border-color 0.15s ease, background 0.15s ease;
}
</style>

<script>
(function () {
	'use strict';

	// Requesting fullscreen is what hides the browser's URL bar. There is no
	// other reliable way: the old scroll-to-hide trick needs a scrollable page,
	// and this one deliberately cannot scroll.
	//
	// It must be called from a user gesture, so it is a button rather than
	// something done automatically on load.

	var btn = document.createElement('button');
	btn.id = 'gf-fullscreen';
	btn.type = 'button';
	btn.title = 'Fullscreen';
	btn.setAttribute('aria-label', 'Toggle fullscreen');
	btn.textContent = '⛶';

	var target = document.documentElement;

	function fsElement() {
		return document.fullscreenElement || document.webkitFullscreenElement || null;
	}

	// iOS Safari on iPhone supports none of the Fullscreen API on arbitrary
	// elements. Feature-detect rather than sniff the UA, and simply never show
	// the button where it could not work — a button that does nothing when
	// tapped is worse than no button.
	function supported() {
		return !!(target.requestFullscreen || target.webkitRequestFullscreen);
	}

	function enter() {
		if (target.requestFullscreen) {
			return target.requestFullscreen({ navigationUI: 'hide' });
		}
		if (target.webkitRequestFullscreen) {
			return target.webkitRequestFullscreen();
		}
	}

	function exit() {
		if (document.exitFullscreen) {
			return document.exitFullscreen();
		}
		if (document.webkitExitFullscreen) {
			return document.webkitExitFullscreen();
		}
	}

	function sync() {
		var on = !!fsElement();
		btn.textContent = on ? '⤡' : '⛶';
		btn.title = on ? 'Exit fullscreen' : 'Fullscreen';
	}

	btn.addEventListener('click', function (e) {
		// The canvas is underneath and would otherwise also see this.
		e.preventDefault();
		e.stopPropagation();

		var p = fsElement() ? exit() : enter();

		// A rejected request is normal — some browsers refuse when the gesture
		// is not trusted. Swallow it rather than logging to a console nobody
		// on a phone can see.
		if (p && typeof p.catch === 'function') {
			p.catch(function () {});
		}

		// On phones, entering fullscreen is nearly always followed by turning
		// the device sideways, and the game is far more usable in landscape.
		// Requesting it is a hint, not a requirement: it rejects on desktop and
		// wherever the browser disallows it, which is fine.
		if (!fsElement() && screen.orientation && screen.orientation.lock) {
			try {
				var lp = screen.orientation.lock('landscape');
				if (lp && typeof lp.catch === 'function') {
					lp.catch(function () {});
				}
			} catch (err) { /* not supported here */ }
		}
	});

	document.addEventListener('fullscreenchange', sync);
	document.addEventListener('webkitfullscreenchange', sync);

	// Dim the button while the player is busy, so it stops covering the board.
	var idleTimer = null;
	function wake() {
		btn.classList.remove('gf-idle');
		if (idleTimer) {
			clearTimeout(idleTimer);
		}
		idleTimer = setTimeout(function () {
			btn.classList.add('gf-idle');
		}, 2500);
	}

	function start() {
		if (!supported()) {
			return;
		}
		document.body.appendChild(btn);
		btn.style.display = 'flex';
		sync();
		wake();
		window.addEventListener('pointermove', wake, { passive: true });
		window.addEventListener('pointerdown', wake, { passive: true });
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', start);
	} else {
		start();
	}
}());
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1579680,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
